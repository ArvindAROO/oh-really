name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest supported version (package.json "engines") and the current LTS.
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: oh-really doctor
        # Windows has no sandbox backend yet, so doctor exits 1 there by design.
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: node dist/cli/main.js doctor
      - name: Sandbox smoke test
        if: runner.os != 'Windows'
        # Proven by hand on Linux, so it must pass there. The macOS Seatbelt
        # profile has not been run on a real Mac yet: report, do not block.
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: npm run smoke
